apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "my-app-role"
        vault.hashicorp.com/agent-inject-secret-config: "internal/data/database/config"
    spec:
      serviceAccountName: my-app-sa
      containers:
      - name: app
        image: alpine
        command: ["sh", "-c", "while true; do cat /vault/secrets/config; sleep 10; done"]